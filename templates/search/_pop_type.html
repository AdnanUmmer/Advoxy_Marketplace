{% load i18n %}
<p class="mb-2 text-xs font-semibold uppercase tracking-wider text-muted">{% translate "Residential" %}</p>
<div class="flex flex-wrap gap-2">
  {% for value, label in form.fields.type.choices %}
  <label class="pill-option"><input type="checkbox" name="type" value="{{ value }}" data-label="{{ label }}" class="sr-only" {% if value in form.type.value %}checked{% endif %}>{{ label }}</label>
  {% endfor %}
</div>
