{% load i18n %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ brand.name }}</title></head>
<body style="margin:0;padding:0;background:#f6f2ea;color:#1a1a17;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f2ea;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e7dfd0;border-radius:14px;">
        <tr><td style="padding:28px 32px 0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700;font-size:22px;">{{ brand.name }}</td></tr>
        <tr><td style="padding:20px 32px 32px;font-size:16px;line-height:1.6;">{% block body %}{% endblock %}</td></tr>
      </table>
      <p style="max-width:560px;margin:18px auto 0;font-size:12px;color:#5b574f;">{{ brand.legal_name }} · {{ brand.support_email }}</p>
    </td></tr>
  </table>
</body></html>
