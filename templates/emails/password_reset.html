{% extends "emails/base.html" %}{% load i18n %}
{% block body %}
<p>{% translate "Someone asked to reset the password for this account." %}</p>
<p style="margin:28px 0;"><a href="{{ site_url }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" style="background:#1e3a2f;color:#f6f2ea;text-decoration:none;padding:12px 22px;border-radius:999px;display:inline-block;">{% translate "Choose a new password" %}</a></p>
<p style="font-size:13px;color:#5b574f;">{% translate "The link works for 24 hours. If you did not ask for this, ignore this email." %}</p>
{% endblock %}
