{% load ui %}
{# Usage: {% include "partials/field.html" with field=form.email %} #}
<div class="{{ wrapper_class|default:'' }}">
  <label class="field-label" for="{{ field.auto_id }}">{{ field.label }}{% if not field.field.required %} <span class="font-normal text-muted">({{ _("optional") }})</span>{% endif %}</label>
  {{ field|field_widget }}
  {% if field.help_text %}<p class="field-help" id="{{ field.auto_id }}_help">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<p class="field-error" id="{{ field.auto_id }}_error">{{ field.errors|join:" " }}</p>{% endif %}
</div>
