# Nginx site for Advoxy. provision.sh replaces __DOMAIN__ and Certbot adds the HTTPS server block.
upstream advoxy_app {
    server unix:/run/advoxy/gunicorn.sock fail_timeout=0;
}

# Requests for unknown hosts are dropped (protects against Host header abuse).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location / { return 444; }
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 25m;          # listing photos (10 MB each) and licence PDFs
    keepalive_timeout 30;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed file names (STATIC_MANIFEST=True): safe to cache for a year.
    location /static/ {
        alias /srv/advoxy/app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public uploads (listing photos, avatars, logos). Licence documents are NOT here:
    # they live in /srv/advoxy/private_media and are only served through a staff-checked view.
    location /media/ {
        alias /srv/advoxy/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        location ~* \.(html?|svg|js)$ { deny all; }
    }

    location / {
        proxy_pass http://advoxy_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
